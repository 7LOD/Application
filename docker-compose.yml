services:
  postgres:
    image: postgres:15
    container_name: myevents_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: eventsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - myevents_network

volumes:
  pgdata:

networks:
  myevents_network: